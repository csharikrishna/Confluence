services:
  - type: web
    name: confluence
    env: python
    # Build dependencies:
    # - requirements.txt: Core FastAPI, uvicorn, slowapi, httpx, argon2-cffi.
    # - requirements-mongo.txt: Lightweight pymongo driver (included unconditionally
    #   so flipping STORAGE_BACKEND=mongo is a pure env-var toggle).
    # - requirements-benchmark.txt: EXCLUDED deliberately from live production build.
    #   Heavy scientific packages (scikit-learn, numpy, torch, sentence-transformers)
    #   are needed only for offline CLI benchmarking (scripts/run_rag_benchmark.py).
    #   Omitting them keeps Render free-tier RAM consumption lean (<250MB vs 512MB limit)
    #   and prevents container OOM restarts while keeping build times under 2 minutes.
    # - requirements-gdrive.txt: Opt-in daily DR export (add if GDRIVE_ENABLED is set).
    buildCommand: pip install -r requirements.txt -r requirements-mongo.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAQ_API_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.0
      # Phase 2 (optional, all safe to leave unset):
      - key: CONFLUENCE_DB_PATH
        sync: false
      - key: ALERT_WEBHOOK_URL
        sync: false
      # Optional durable storage backend. STORAGE_BACKEND=mongo (recommended —
      # MongoDB Atlas free tier, fully managed, no card required) needs only
      # MONGODB_URI below. Leave STORAGE_BACKEND unset for SQLite (default).
      # (A CouchDB backend was built and verified, then archived to the
      # archive/couchdb-backend branch — Mongo covers everything it would have.)
      - key: STORAGE_BACKEND
        sync: false
      - key: MONGODB_URI
        sync: false
      # Optional daily Google Drive backup (requires requirements-gdrive.txt
      # installed — add a second buildCommand step if enabling this).
      - key: GDRIVE_ENABLED
        sync: false
      - key: GDRIVE_FOLDER_ID
        sync: false
      - key: GDRIVE_SERVICE_ACCOUNT_JSON
        sync: false
    # --- Persistent history storage (requires a paid Render plan) ---
    # Render's free tier has an ephemeral filesystem: confluence_history.db is
    # wiped on every redeploy, so trend_24h/alert history won't survive across
    # deploys until this is enabled. To turn it on: upgrade this service off the
    # free plan, uncomment the block below, and set CONFLUENCE_DB_PATH above to
    # /var/data/confluence_history.db. Free-tier deploys will fail if this disk
    # block is active, so it's left commented out rather than defaulted on.
    # disk:
    #   name: confluence-data
    #   mountPath: /var/data
    #   sizeGB: 1

