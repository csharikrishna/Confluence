name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        # requirements-mongo.txt is small and installed unconditionally here (same
        # reasoning as render.yaml) so test_mongo_storage.py exercises the real
        # pymongo driver rather than a degraded fallback. requirements-gdrive.txt
        # stays opt-in — gdrive_backup.py imports its libraries lazily inside
        # functions, so its tests correctly skip without it, no NameError risk.
        run: pip install -r requirements.txt -r requirements-mongo.txt

      - name: Run offline test suite
        run: pytest tests/ --ignore=tests/test_live_remote.py -v
