name: Keep Alive Ping (Prevent Idle Spin-Down)

on:
  schedule:
    # Trigger every 12 minutes (Render free-tier idle limit is 15 minutes)
    - cron: '*/12 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Live API Health Endpoint
        run: |
          TARGET_URL="${{ secrets.RENDER_APP_URL }}"
          if [ -z "$TARGET_URL" ]; then
            echo "No RENDER_APP_URL secret configured yet. Skipping ping."
            exit 0
          fi
          echo "Sending keep-alive ping to $TARGET_URL/health ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$TARGET_URL/health")
          echo "Received HTTP status: $STATUS"
          if [ "$STATUS" -ne 200 ]; then
            echo "Warning: Received unexpected status code $STATUS"
            exit 1
          fi
          echo "Keep-alive ping successful!"
