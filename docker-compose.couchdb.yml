# Local/dev CouchDB for the optional STORAGE_BACKEND=couchdb path.
# Start:  docker compose -f docker-compose.couchdb.yml up -d
# Stop:   docker compose -f docker-compose.couchdb.yml down
# Wipe:   docker compose -f docker-compose.couchdb.yml down -v
#
# This is NOT what you'd point a real deployment at as-is — COUCHDB_PASSWORD
# below is a placeholder for local dev. For production, run this on your actual
# host (e.g. an Oracle Cloud Always Free VM) with a real password set via a
# secret/env file that isn't committed, and put it behind a firewall/VPN or
# TLS-terminating proxy rather than exposing 5984 publicly.
services:
  couchdb:
    image: couchdb:3.5
    container_name: confluence-couchdb
    restart: unless-stopped
    ports:
      - "5984:5984"
    environment:
      COUCHDB_USER: admin
      COUCHDB_PASSWORD: confluence_dev_pw
    volumes:
      - confluence_couchdb_data:/opt/couchdb/data

volumes:
  confluence_couchdb_data:
